[package]
name = "session-memory"
version = "0.1.0"
edition = "2021"
publish = false
description = "Measures the peak memory (RSS) of each step of opening a large session (docs/18-large-session-memory.md). Read-only: does not change the core."

[dependencies]
scrapelens-core = { path = "../../core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
libc = "0.2"
