[package]
name = "proxy-acceptance-driver"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
# test-hooks: the test variables that the proxy checks read (SCRAPELENS_TEST_PROXY_CA, ...)
scrapelens-capture = { path = "../../../../capture", features = ["test-hooks"] }
serde_json = "1"

# Own workspace: the driver is not part of the product workspaces.
[workspace]
