[package]
name = "scrapelens-recon"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Site recognition (site_profile) for ScrapeLens: anti-bot protections, blocks and requirements, with evidence"
publish = false

[dependencies]
scrapelens-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Crate independent of core and src-tauri (core knows no vendor at all).
