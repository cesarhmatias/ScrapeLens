[package]
name = "scrapelens-mcp"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"
description = "ScrapeLens MCP: servidor local, somente leitura, sobre sessões já capturadas"
publish = false

[dependencies]
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros", "schemars", "elicitation"] }
schemars = "1.2.3"
scrapelens-core = { path = "../core" }
scrapelens-capture = { path = "../capture" }
scrapelens-recon = { path = "../recon" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
icu_properties = "2.4"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std", "signal", "time"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "scrapelens_mcp"
path = "src/lib.rs"

[[bin]]
name = "scrapelens-mcp"
path = "src/main.rs"

# Servidor com navegador falso para os testes ponta a ponta (não faz parte do produto).
[[example]]
name = "fake_server"
path = "examples/fake_server.rs"
