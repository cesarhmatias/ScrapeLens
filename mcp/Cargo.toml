[package]
name = "scrapelens-mcp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "ScrapeLens MCP: servidor local, somente leitura, sobre sessões já capturadas"
publish = false

[dependencies]
rmcp = { version = "3.8.0", features = ["server", "transport-io", "macros", "schemars"] }
schemars = "1.2.3"
scrapelens-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
tempfile = "3"

[lib]
name = "scrapelens_mcp"
path = "src/lib.rs"

[[bin]]
name = "scrapelens-mcp"
path = "src/main.rs"
