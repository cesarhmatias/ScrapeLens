[package]
name = "scrapelens-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "ScrapeLens core: session model, importers, correlation, normalization, diff and exporters"
publish = false

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "scrapelens-core"
path = "src/bin/scrapelens-core.rs"
