[package]
name = "scrapelens-testserver"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.1"
chrono = "0.4.45"
httlib-hpack = "0.1.3"
quiche = "0.30.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
h2 = "0.4.20"
http = "1.5.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
