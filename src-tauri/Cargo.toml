[package]
name = "scrapelens"
version = "0.1.2"
description = "ScrapeLens desktop shell (Tauri 2) — HTTP session inspector"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[features]
# Test-only switches (environment variables read by the App, command-line test actions).
# Off in release builds. Chains to the capture crate's own feature (its test variables).
test-hooks = ["scrapelens-capture/test-hooks"]

[lib]
name = "scrapelens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
scrapelens-core = { path = "../core" }
scrapelens-capture = { path = "../capture" }
scrapelens-natural-ajax = { path = "../adapters/natural-ajax" }
thiserror = "2"
