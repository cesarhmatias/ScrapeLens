[package]
name = "scrapelens-capture"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Live capture for ScrapeLens: Chrome with a dedicated profile, CDP + NetLog, allowlist, controlled capture (no Tauri)"
publish = false

[dependencies]
scrapelens-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = "0.28"
libc = "0.2"
# TLS to an https:// proxy on the relay path. ring only (no aws-lc). Certificate
# checks use the system trust store; nothing disables them.
rustls = { version = "0.23.31", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.1"
rustls-pemfile = "2.2.0"

[features]
# Off by default, including release builds. `cargo test` still exercises the
# gated reads (`cfg(test)`). The App turns this on by chaining its own
# `test-hooks` feature to `scrapelens-capture/test-hooks`. Decisions for each
# variable are next to `NetworkMode` in `src/lib.rs`.
test-hooks = []

[dev-dependencies]
# HTTPS upstream tests mint a synthetic CA in memory. scrapelens-testserver::cert::test_tls()
# would compile quiche into every capture test; rcgen does not, and it leaves no key in the tree.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

# Crate independente: sem Tauri, sem janela. O App (src-tauri) e o servidor MCP a consomem.
[workspace]
