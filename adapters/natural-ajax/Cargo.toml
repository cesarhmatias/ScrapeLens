version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Adaptador Natural for Ajax para o ScrapeLens (gramática do campo XML do Connector)"
publish = false

[dependencies]
scrapelens-core = { path = "../../core" }
